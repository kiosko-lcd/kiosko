name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TESSERA_QUIET: '1'
      - name: Package and smoke-test the CLI
        shell: bash
        run: |
          node scripts/build-dist.mjs
          node dist/tessera/cli.js doctor --config examples/showcase.json
          node dist/tessera/cli.js render --config examples/showcase.json --page Cats --out cats.png
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: frame-${{ matrix.os }}
          path: cats.png
