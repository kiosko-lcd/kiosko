name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Not ubuntu-latest: Playwright's Chromium (the demo check below) isn't supported on every new release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clone the official plugins next to Kiosko
        run: |
          mkdir -p ../kiosko-plugins
          for p in agents cats system vitals usage weather calendar news mirror gitlab github calls timesheet llm gpu; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/kiosko-plugin-$p" "../kiosko-plugins/kiosko-plugin-$p" || echo "no kiosko-plugin-$p"
          done
      - run: npm install --no-audit --no-fund
      - run: npm run dev:link
      - run: node --conditions=source packages/server/src/cli.ts gallery --out site
      # The editor running in the browser with sample data, https://kioskolcd.dev/demo/
      # (end-to-end check: scripts/demo-check-docker.sh).
      - name: Browser demo
        run: node packages/web/build.mjs --demo --out site/demo
      # The config's JSON Schema at its stable address, https://kioskolcd.dev/schema/v1/config.json
      # (with the official plugins). The custom domain is also set in Settings → Pages.
      - name: Config schema and domain
        run: |
          node --conditions=source packages/server/src/cli.ts config schema --out site/schema/v1/config.json
          echo kioskolcd.dev > site/CNAME
      # Open the demo in a real browser (scripts/demo-check.mjs) BEFORE publishing it: a build that
      # passes the unit tests can still die in a browser (`Buffer` or `fs` don't exist there), and
      # this job failing means the deploy never runs, so the last working demo stays online.
      - name: Check the browser demo in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          cd "$RUNNER_TEMP/pw" && node "$GITHUB_WORKSPACE/scripts/demo-check.mjs" "$GITHUB_WORKSPACE/site" "$RUNNER_TEMP/demo-check" --browsers chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-check
          path: ${{ runner.temp }}/demo-check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    # A manual run on another branch builds and checks the site but never publishes it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
