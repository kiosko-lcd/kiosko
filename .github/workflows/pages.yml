name: Gallery

on:
  push:
    branches: [main]
  # Daily, for the plugin store's catalogue (new plugins and versions on npm, yesterday's downloads,
  # which npm has counted by then).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Not ubuntu-latest: Playwright's Chromium (the demo check below) isn't supported on every new release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Clone the official plugins next to Kiosko
        run: |
          mkdir -p ../kiosko-plugins
          for p in agents cats system vitals usage weather calendar news mirror gitlab github calls timesheet llm gpu homeassistant; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/kiosko-plugin-$p" "../kiosko-plugins/kiosko-plugin-$p" || echo "no kiosko-plugin-$p"
          done
      - run: npm install --no-audit --no-fund
      - run: npm run dev:link
      # The site paints the panel in Chinese too (the posters of /zh-Hant/ and /zh-Hans/): the panel
      # takes its CJK font from the system, and this runner has none.
      - name: CJK fonts for the panel
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      # The whole site (packages/web/landing/build.mjs): the front page, https://kioskolcd.dev/ ; the
      # widget gallery, /gallery/ ; the editor running in the browser with sample data, /demo/ ; the
      # panel in 3D, /demo/3d/ ; the screen firmware's installer, /flash/ ; and the config's JSON Schema at its stable address,
      # /schema/v1/config.json (with the official plugins). The same build is checked end to end
      # on a developer's machine by scripts/demo-check-docker.sh.
      # The plugin store reads every plugin's tarball once per version: kept between runs by its
      # integrity (scripts/store/build-index.ts), with npm's ETags for the rest.
      - uses: actions/cache@v6
        with:
          path: tmp/store-cache
          key: store-cache-${{ github.run_id }}
          restore-keys: store-cache-
      # ... and the plugin store, /store/ in every language, with its catalogue as data at
      # /store/v1/ (index.json, plugins/<id>.json, withdrawn.json, schema/): from npm, read without
      # running any plugin's code. The token only reads public repositories' stars.
      # The screen firmware's web installer (/flash/) serves the latest release's full image itself:
      # a browser can't read a release's files from GitHub (no CORS), and mainland China can't reach
      # GitHub. Checked against its .sha256 by the build. No release with one yet: the page says
      # where to download it, and the site is still published.
      - name: Screen firmware of the latest release, for the web installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download -R "$GITHUB_REPOSITORY" --pattern 'kiosko-screen-*-full.bin*' --dir "$RUNNER_TEMP/firmware" || echo "::warning::no screen firmware in the latest release"
      - name: Front page, gallery, browser demo, config schema, plugin store and firmware installer
        run: node packages/web/build.mjs --site --out site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KIOSKO_SITE_FIRMWARE: ${{ runner.temp }}/firmware
      # The custom domain is also set in Settings → Pages.
      - name: Domain
        run: echo kioskolcd.dev > site/CNAME
      # Open the demo and the front page in a real browser (scripts/demo-check.mjs) BEFORE
      # publishing them: a build that passes the unit tests can still die in a browser (`Buffer` or
      # `fs` don't exist there), and this job failing means the deploy never runs, so the last
      # working site stays online.
      - name: Check the browser demo and the front page in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.55.0 --no-audit --no-fund
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          cd "$RUNNER_TEMP/pw" && node "$GITHUB_WORKSPACE/scripts/demo-check.mjs" "$GITHUB_WORKSPACE/site" "$RUNNER_TEMP/demo-check" --browsers chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: demo-check
          path: ${{ runner.temp }}/demo-check
      # Hidden files too: /.well-known/security.txt (where to report a vulnerability).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
  deploy:
    needs: build
    # A manual run on another branch builds and checks the site but never publishes it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
